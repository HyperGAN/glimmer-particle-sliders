[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-glimmer-modern-response"
version = "0.2.0"
description = "Standalone Glimmer ParticleGAN 0.11.0 response lifecycle CPU conformance cohort"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.15"
dependencies = [
  "torch>=2.6,<3",
  "hndl==0.10.0",
  "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7",
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@c13890f8e2a1ecf1dc8eb9f2a37f9187cb9fea78#subdirectory=packages/particle-sliders-core",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1"]

[project.entry-points."particle_sliders.response_backends"]
glimmer-modern = "glimmer_modern.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
glimmer-modern = "glimmer_modern.lifecycle:INFERENCE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glimmer_modern = ["*.hndl", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
