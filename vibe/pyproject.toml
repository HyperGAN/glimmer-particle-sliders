[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glimmer-particle-vibe"
version = "0.1.0"
description = "Train and sample Muse Glimmer 30B text vibes with ParticleGAN 0.12.0"
requires-python = ">=3.11"
dependencies = [
    "particle-sliders-vibe[text,glimmer] @ git+https://github.com/HyperGAN/particle-sliders.git@7e113f67879a7e9c660d0622487e4953a4b46756#subdirectory=packages/particle-sliders-vibe",
]

[project.scripts]
glimmer-vibe = "glimmer_vibe:main"

[tool.setuptools]
py-modules = ["glimmer_vibe"]
